name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.13-slim
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wiregui
          POSTGRES_PASSWORD: wiregui
          POSTGRES_DB: wiregui
        options: >-
          --health-cmd "pg_isready -U wiregui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mock-oidc:
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
          - 9000:9000
        env:
          SERVER_PORT: "9000"
          JSON_CONFIG: >
            {
              "interactiveLogin": true,
              "httpServer": "NettyWrapper",
              "tokenCallbacks": [
                {
                  "issuerId": "test-idp",
                  "tokenExpiry": 3600,
                  "requestMappings": [
                    {
                      "requestParam": "scope",
                      "match": "*",
                      "claims": {
                        "sub": "$${claim:sub}",
                        "email": "$${claim:sub}@test.local",
                        "name": "Test User"
                      }
                    }
                  ]
                }
              ]
            }
    env:
      CI: "true"
      WG_DATABASE_URL: postgresql+asyncpg://wiregui:wiregui@postgres/wiregui
      WG_REDIS_URL: redis://valkey:6379/0
      MOCK_OIDC_HOST: mock-oidc
    steps:
      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git wireguard-tools pkg-config libxml2-dev libxmlsec1-dev libxmlsec1-openssl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run unit tests
        run: uv run pytest tests/ --ignore=tests/e2e -v --tb=short

      - name: Run E2E tests
        run: |
          uv run alembic upgrade head
          uv run pytest tests/e2e/ -v --tb=short

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync --group dev

      - name: Semantic release
        id: semrel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(uv run semantic-release version --print 2>/dev/null || echo "")
          if [ -z "$VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No release needed"
          else
            uv run semantic-release version
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "new_version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "Released v${VERSION}"
          fi

    outputs:
      new_version: ${{ steps.semrel.outputs.new_version }}
      skip: ${{ steps.semrel.outputs.skip }}

  docker:
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          VERSION="${{ needs.release.outputs.new_version }}"
          TAG="v${VERSION}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/wiregui"

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          echo "Building ${IMAGE}:${TAG}"

          docker build --no-cache \
            --build-arg "VERSION=${VERSION}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:${MAJOR}.${MINOR}" \
            -t "${IMAGE}:latest" \
            .

          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:${MAJOR}.${MINOR}"
          docker push "${IMAGE}:latest"

          echo "Pushed ${IMAGE}:${TAG}, ${IMAGE}:${MAJOR}.${MINOR}, ${IMAGE}:latest"