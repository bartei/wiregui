[project]
name = "wiregui"
version = "1.0.0-rc.4"
description = "WireGuard VPN management platform — Python/NiceGUI rewrite of Wirezone"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    # UI
    "nicegui>=3.12.0",
    # ORM & Database
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # Configuration
    "pydantic-settings>=2.14.2",
    # Cache
    "redis>=5.2",
    # Encryption
    "cryptography>=48.0.1",
    # Auth
    "bcrypt>=4.0",
    "pyjwt[crypto]>=2.13.0",
    "authlib>=1.6.11",
    "pyotp>=2.9",
    "webauthn>=2.2",
    "python3-saml>=1.16",
    # HTTP client
    "httpx>=0.28",
    # Email
    "aiosmtplib>=5.1.1",
    # QR codes
    "qrcode[pil]>=8.0",
    # YAML config
    "pyyaml>=6.0",
    # Logging
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    # >=10.6.1 relaxes its click~=8.1.0 pin, which held click below its CVE fix
    "python-semantic-release>=10.6.1",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# E2E tests run separately: uv run pytest tests/e2e/
# NiceGUI's testing plugin conflicts with unit tests when loaded together
addopts = "--ignore=tests/e2e"
main_file = "wiregui/main.py"

# ---------------------------------------------------------------------------
# Semantic Release
# ---------------------------------------------------------------------------
[tool.uv]
# Floors below pin transitive dependencies above their last known CVE.
constraint-dependencies = [
    "Mako>=1.3.12",
    "python-multipart>=0.0.31",
    "Pillow>=12.3.0",
    "lxml>=6.1.1",
    "lxml-html-clean>=0.4.5",
    "aiohttp>=3.14.1",
    "starlette>=1.3.1",
    "idna>=3.15",
    "urllib3>=2.7.0",
    "click>=8.3.3",
    "GitPython>=3.1.55",
    "joserfc>=1.6.8",
    "pyasn1>=0.6.4",
    "python-engineio>=4.13.2",
    "python-socketio>=5.16.2",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
build_command = ""
major_on_zero = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^chore\\(release\\):",
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
upload_to_vcs_release = false
